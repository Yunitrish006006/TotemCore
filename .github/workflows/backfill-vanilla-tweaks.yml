name: Backfill VanillaTweaks Modrinth

on:
  pull_request:
    branches: [master]
    paths:
      - .github/staging/vanilla-tweaks-backfill-request.json

permissions:
  contents: read

jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out request
        uses: actions/checkout@v4

      - name: Read request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request=.github/staging/vanilla-tweaks-backfill-request.json
          version="$(jq -er '.version' "$request")"
          release_ref="$(jq -er '.release_ref' "$request")"
          test "$version" = 0.1.14
          test "$release_ref" = e81b86615583d591580a146f48b77aa57f37f769
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_ref=$release_ref" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Check out VanillaTweaks 0.1.14
        uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/TotemVanillaTweaks
          ref: '${{ steps.request.outputs.release_ref }}'
          path: vanilla
          fetch-depth: 0
          persist-credentials: false

      - name: Check out pinned TotemCore 0.7.2
        uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/TotemCore
          ref: a8cedca207f9d4444ae4a52fd384ebd830fbd026
          path: core-0.7.2
          persist-credentials: false

      - name: Build VanillaTweaks release JAR
        shell: bash
        env:
          EXPECTED_VERSION: '${{ steps.request.outputs.version }}'
        run: |
          set -euo pipefail
          chmod +x vanilla/gradlew core-0.7.2/gradlew
          ./core-0.7.2/gradlew -p core-0.7.2 jar --no-daemon --stacktrace
          core_version="$(sed -n 's/^mod_version=//p' core-0.7.2/gradle.properties)"
          test "$core_version" = 0.7.2
          core_jar="$GITHUB_WORKSPACE/core-0.7.2/build/libs/totem-core-${core_version}.jar"
          test -f "$core_jar"
          test "$(sed -n 's/^mod_version=//p' vanilla/gradle.properties)" = "$EXPECTED_VERSION"
          ./vanilla/gradlew -p vanilla -PtotemCoreJar="$core_jar" jar --no-daemon --stacktrace
          artifact="vanilla/build/libs/totem-vanilla-tweaks-${EXPECTED_VERSION}.jar"
          [[ -f "$artifact" ]] || ./vanilla/gradlew -p vanilla -PtotemCoreJar="$core_jar" remapJar --no-daemon --stacktrace
          test -f "$artifact"
          unzip -p "$artifact" fabric.mod.json >/tmp/fabric.mod.json
          jq -e --arg v "$EXPECTED_VERSION" '.id=="totem-vanilla-tweaks" and .version==$v and .depends.minecraft=="~26.2" and .depends["totem-core"]==">=0.7.0 <0.8.0"' /tmp/fabric.mod.json >/dev/null

      - name: Discover target project and publish
        id: modrinth
        shell: bash
        env:
          MODRINTH_TOKEN: '${{ secrets.MODRINTH_TOKEN }}'
          EXPECTED_VERSION: '${{ steps.request.outputs.version }}'
        run: |
          set -euo pipefail
          test -n "$MODRINTH_TOKEN" || { echo 'TotemCore MODRINTH_TOKEN is missing.' >&2; exit 1; }

          api=https://api.modrinth.com/v2
          args=(--fail --silent --show-error --retry 3 -H "Authorization: ${MODRINTH_TOKEN}" -H 'User-Agent: Yunitrish006006/totem-vanilla-tweaks-backfill/1.0')

          curl "${args[@]}" "$api/user" >/tmp/user.json
          user_id="$(jq -er '.id' /tmp/user.json)"
          curl "${args[@]}" "$api/user/${user_id}/projects" >/tmp/projects.json

          github_url='https://github.com/Yunitrish006006/TotemVanillaTweaks'
          project_ids="$(jq -r --arg url "$github_url" '.[] | select((.source_url // "") == $url or (.title | ascii_downcase) == "totem vanilla tweaks" or (.slug | ascii_downcase) == "totem-vanilla-tweaks") | .id' /tmp/projects.json)"
          count="$(printf '%s\n' "$project_ids" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [[ "$count" != 1 ]]; then
            echo "Expected exactly one manageable TotemVanillaTweaks project, found $count." >&2
            jq -r '.[] | [.id,.slug,.title,(.source_url // ""),(.status // "")] | @tsv' /tmp/projects.json >&2
            exit 1
          fi
          project_id="$(printf '%s\n' "$project_ids" | sed '/^$/d')"

          artifact="vanilla/build/libs/totem-vanilla-tweaks-${EXPECTED_VERSION}.jar"
          sha="$(sha512sum "$artifact" | awk '{print $1}')"
          curl "${args[@]}" "$api/project/${project_id}/version?include_changelog=false" >/tmp/versions.json
          existing_count="$(jq --arg v "$EXPECTED_VERSION" '[.[] | select(.version_number==$v)] | length' /tmp/versions.json)"

          if [[ "$existing_count" == 0 ]]; then
            changelog="$(git -C vanilla log -1 --format=%B)"
            data="$(jq -nc --arg n "totem-vanilla-tweaks ${EXPECTED_VERSION}" --arg v "$EXPECTED_VERSION" --arg c "$changelog" --arg p "$project_id" '{name:$n,version_number:$v,changelog:$c,dependencies:[],game_versions:["26.2"],version_type:"release",loaders:["fabric"],featured:false,status:"listed",project_id:$p,file_parts:["primary"],primary_file:"primary",environment:"client_and_server"}')"
            curl "${args[@]}" -X POST "$api/version" \
              -F "data=${data};type=application/json" \
              -F "primary=@${artifact};filename=$(basename "$artifact");type=application/java-archive" \
              >/tmp/version.json
            version_id="$(jq -er '.id' /tmp/version.json)"
          else
            test "$existing_count" = 1
            version_id="$(jq -er --arg v "$EXPECTED_VERSION" '.[] | select(.version_number==$v) | .id' /tmp/versions.json)"
            existing_sha="$(jq -er --arg v "$EXPECTED_VERSION" '.[] | select(.version_number==$v) | (([.files[]|select(.primary==true)][0]//.files[0]).hashes.sha512)' /tmp/versions.json)"
            test "$existing_sha" = "$sha" || { echo 'Existing 0.1.14 has a different SHA-512.' >&2; exit 1; }
          fi

          curl "${args[@]}" "$api/version/${version_id}" >/tmp/remote.json
          jq -e --arg p "$project_id" --arg v "$EXPECTED_VERSION" --arg f "$(basename "$artifact")" --arg sha "$sha" '.project_id==$p and .version_number==$v and .game_versions==["26.2"] and .loaders==["fabric"] and (([.files[]|select(.primary==true)][0]//.files[0]).filename==$f) and (([.files[]|select(.primary==true)][0]//.files[0]).hashes.sha512==$sha)' /tmp/remote.json >/dev/null

          echo "project_id=$project_id" >> "$GITHUB_OUTPUT"
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"
          echo "sha512=$sha" >> "$GITHUB_OUTPUT"
          echo "BACKFILL_RESULT project_id=$project_id version_id=$version_id sha512=$sha"
