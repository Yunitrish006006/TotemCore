name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: chmod +x gradlew
      - run: ./gradlew build --no-daemon --stacktrace
      - name: Verify Core-only Dedicated Server startup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run/server
          printf 'eula=true\n' > run/server/eula.txt
          : > core-server.log

          setsid ./gradlew runServer --no-daemon --stacktrace > core-server.log 2>&1 &
          server_pid=$!

          cleanup() {
            kill -TERM -- "-${server_pid}" 2>/dev/null || true
            wait "${server_pid}" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in {1..75}; do
            if grep -Fq 'Done (' core-server.log; then
              if ! grep -Fq 'TotemCore API ' core-server.log; then
                cat core-server.log
                exit 1
              fi
              exit 0
            fi

            if ! kill -0 "${server_pid}" 2>/dev/null; then
              cat core-server.log
              exit 1
            fi

            sleep 1
          done

          cat core-server.log
          exit 1
